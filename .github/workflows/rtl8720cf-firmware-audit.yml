name: rtl8720cf-firmware-audit

on:
  workflow_dispatch:
  pull_request:
    branches:
      - codex/add-compatibility-and-protocol-discovery-mode
    paths:
      - .github/workflows/rtl8720cf-firmware-audit.yml
      - tools/firmware_research/**
      - tests/test_rtl8720cf_image.py
  push:
    branches:
      - agent/correct-gree-telemetry-direct
    paths:
      - .github/workflows/rtl8720cf-firmware-audit.yml
      - tools/firmware_research/**
      - tests/test_rtl8720cf_image.py

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install deterministic analysis dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y binutils-arm-none-eabi jq unzip
          python -m pip install --upgrade pip
          python -m pip install capstone

      - name: Download and verify authoritative RTL8720CF images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p firmware-research/input firmware-research/results firmware-research/sections
          base='https://raw.githubusercontent.com/maxim-smirnov/gree-wifimodule-firmware/main/362001065279'
          curl --fail --location --retry 5 --retry-all-errors \
            "$base/U-WB05RT13V1.21-4307516678339185323.bin" \
            -o firmware-research/input/rtl8720cf-v1.21.bin
          curl --fail --location --retry 5 --retry-all-errors \
            "$base/U-WB05RT13V1.53-17090889809932733253.bin" \
            -o firmware-research/input/rtl8720cf-v1.53.bin
          python - <<'PY'
          from hashlib import sha1, sha256
          from pathlib import Path

          expected = {
              'rtl8720cf-v1.21.bin': '7c8b864f6d5e621bfc79265ad928f5cc1c8c09a1',
              'rtl8720cf-v1.53.bin': '0c0f46e3631fdefa0ce23eb27c14cff0ccb47c3a',
          }
          rows = []
          for name, expected_blob in expected.items():
              path = Path('firmware-research/input') / name
              data = path.read_bytes()
              blob = sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
              if blob != expected_blob:
                  raise SystemExit(f'{name}: Git blob {blob} != {expected_blob}')
              rows.append(f'{name} bytes={len(data)} git_blob={blob} sha256={sha256(data).hexdigest()}')
          Path('firmware-research/results/input-manifest.txt').write_text('\n'.join(rows) + '\n')
          print('\n'.join(rows))
          PY

      - name: Parse containers, extract load images, and compare raw content
        shell: bash
        run: |
          set -euo pipefail
          for version in v1.21 v1.53; do
            python tools/firmware_research/rtl8720cf_image.py \
              "firmware-research/input/rtl8720cf-${version}.bin" \
              --json "firmware-research/results/${version}-manifest.json" \
              --strings "firmware-research/results/${version}-strings.json" \
              --frames "firmware-research/results/${version}-frames.json" \
              --extract-dir "firmware-research/sections/${version}"
          done
          python tools/firmware_research/analyze_rtl8720cf.py \
            firmware-research/input/rtl8720cf-v1.21.bin \
            firmware-research/input/rtl8720cf-v1.53.bin \
            --json firmware-research/results/v1.21-v1.53-comparison.json \
            --markdown firmware-research/results/v1.21-v1.53-comparison.md
          python -m unittest tests.test_rtl8720cf_image -v

      - name: Produce complete Thumb disassembly fallback
        shell: bash
        run: |
          set -euo pipefail
          for version in v1.21 v1.53; do
            xip=$(find "firmware-research/sections/${version}" -type f \
              -name '*_xip_0x9B000140.bin' -print -quit)
            test -n "$xip"
            arm-none-eabi-objdump -D -b binary -marm -Mforce-thumb \
              --adjust-vma=0x9B000140 "$xip" \
              > "firmware-research/results/${version}-thumb-objdump.txt"
          done

      - name: Install fixed official Ghidra release
        shell: bash
        run: |
          set -euo pipefail
          ghidra_version=11.3.2
          curl --fail --location --retry 5 --retry-all-errors \
            "https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_${ghidra_version}_build/ghidra_${ghidra_version}_PUBLIC_20250415.zip" \
            -o "$RUNNER_TEMP/ghidra.zip"
          unzip -q "$RUNNER_TEMP/ghidra.zip" -d "$RUNNER_TEMP"
          find "$RUNNER_TEMP" -maxdepth 3 -type f -path '*/support/analyzeHeadless' \
            -print -quit > "$RUNNER_TEMP/analyze-headless.txt"
          test -s "$RUNNER_TEMP/analyze-headless.txt"

      - name: Recover V2 and V3 code, call graphs, builders, and parsers
        shell: bash
        run: |
          set -euo pipefail
          analyze_headless=$(cat "$RUNNER_TEMP/analyze-headless.txt")
          mkdir -p "$RUNNER_TEMP/ghidra-projects" firmware-research/results/ghidra
          for version in v1.21 v1.53; do
            xip=$(find "firmware-research/sections/${version}" -type f \
              -name '*_xip_0x9B000140.bin' -print -quit)
            test -n "$xip"
            "$analyze_headless" "$RUNNER_TEMP/ghidra-projects" "rtl8720cf-${version}" \
              -import "$xip" \
              -overwrite \
              -loader BinaryLoader \
              -processor 'ARM:LE:32:Cortex' \
              -loader-baseAddr 0x9B000140 \
              -preScript setup_rtl8720cf.py 0x9B000140 0x9B000150 \
              -preScript seed_rtl8720cf_functions.py 0x9B000140 \
              -analysisTimeoutPerFile 3600 \
              -scriptPath tools/firmware_research \
              -postScript audit_rtl8720cf_protocol.py \
                "$GITHUB_WORKSPACE/firmware-research/results/ghidra/${version}-audit.txt" \
                "$version" \
              -postScript extract_rtl8720cf_protocol.py \
                "$GITHUB_WORKSPACE/firmware-research/results/ghidra/${version}-protocol.txt" \
              > "firmware-research/results/ghidra/${version}-console.txt" 2>&1
          done

      - name: Index audit results
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          find firmware-research/results -type f -printf '%p %s bytes\n' | sort \
            | tee firmware-research/results/artifact-index.txt
          for report in firmware-research/results/ghidra/*-audit.txt; do
            test -f "$report" || continue
            printf '\n===== %s section index =====\n' "$report" \
              >> firmware-research/results/audit-sections.txt
            grep '^=== ' "$report" >> firmware-research/results/audit-sections.txt || true
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rtl8720cf-firmware-audit
          path: firmware-research/results
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
