name: remove-temporary-agent-branches

on:
  pull_request:
    branches:
      - codex/add-compatibility-and-protocol-discovery-mode
    paths:
      - .github/workflows/tmp-export-post-rtl044-source.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify retained branches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.ref'
          gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/codex/add-compatibility-and-protocol-discovery-mode" --jq '.ref'

      - name: Delete temporary agent branches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          branches=(
            'agent/audit-rtl-command-families'
            'agent/audit-rtl-energy-flow-command'
            'agent/recovered-rtl-telemetry'
            'agent/export-post-rtl044-source'
          )
          for branch in "${branches[@]}"; do
            echo "Deleting ${branch}"
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}"
          done
