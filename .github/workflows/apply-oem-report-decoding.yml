          Path("docs/oem-report-decoding.md").write_text("""# Recovered OEM report decoding

A Gree Livo Gen3 hardware capture confirmed this startup/query sequence:

- `0x32` synchronization reply with payload `00`;
- `0x44` 24-byte information reply;
- `0x33` 45-byte general/fault report;
- `0x34` 45-byte indoor-unit report;
- `0x35` 45-byte outdoor-unit report.

The attempted extended/monthly-energy selector did not produce `0x40` on this unit; it was followed by an ordinary `0x31` status reply. The `0x40` entity therefore remains available for models that implement it, but no energy values are invented for this Livo.

Observed `0x34` payload bytes 7 and 8 decoded as raw minus 40 exactly matched the 25 C target and 24 C current temperature during the capture. Bytes 10 and 25 also produced physically plausible values. Observed `0x35` bytes 13-15 changed over time and produced plausible values with the same transform. These remain explicitly named hypotheses until controlled tests identify each physical sensor.

Stable routine `0x01`/`0x31` records are de-duplicated in the capture history so the rare replies survive long enough to export. The CSV state is bounded to avoid ESPHome API JSON truncation.
""")
