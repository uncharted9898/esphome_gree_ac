substitutions:
  device_name: gree-livo-gen3
  friendly_name: Gree Livo Gen3

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

logger:
  baud_rate: 0
  level: DEBUG
  logs:
    api: INFO
    sensor: INFO
    binary_sensor: INFO
    text_sensor: INFO
    sinclair_ac: DEBUG
    sinclair_ac.serial: DEBUG
    gree.oem_boot_probe: DEBUG
    gree.oem_report_sensors: DEBUG

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

web_server:
  port: 80

uart:
  id: gree_uart
  tx_pin: GPIO6
  rx_pin: GPIO4
  baud_rate: 4800
  data_bits: 8
  parity: EVEN
  stop_bits: 1
  rx_buffer_size: 2048

external_components:
  - source:
      type: git
      url: https://github.com/uncharted9898/esphome_gree_ac
      ref: agent/discover-gree-power-data
    # Use a short refresh while testing this PR. Delete the ESPHome build files
    # once after switching branches so an older cached component is not reused.
    refresh: 5min
    components:
      - sinclair_ac
      - gree_oem_boot_probe
      - gree_oem_report_sensors

climate:
  - platform: sinclair_ac
    id: gree_ac
    name: ${friendly_name}
    uart_id: gree_uart
    protocol_mode: receive_only
    fan_profile: gree_4_speed

    telemetry_discovery:
      enabled: true
      expose_raw_payload: true
      expose_raw_bytes: false
      log_changes_only: true
      # Keeps the CSV under ESPHome's text-state JSON limit while preserving
      # rare 0x33/0x34/0x35/0x40 responses and changed routine frames.
      history_depth: 24

    debug:
      log_rx: false
      log_tx: false
      log_unknown_packets: true
      log_packet_differences: true
      maximum_hex_length: 256

    diagnostics:
      communication:
        name: ${friendly_name} Communication
        entity_category: diagnostic
      valid_rx_packets:
        name: ${friendly_name} Valid RX Packets
        entity_category: diagnostic
      valid_tx_packets:
        name: ${friendly_name} Valid TX Packets
        entity_category: diagnostic
      unknown_packets:
        name: ${friendly_name} Unknown Valid Packets
        entity_category: diagnostic
      checksum_failures:
        name: ${friendly_name} Checksum Failures
        entity_category: diagnostic
      invalid_length_packets:
        name: ${friendly_name} Invalid Length Packets
        entity_category: diagnostic
      too_short_frames:
        name: ${friendly_name} Too Short Frames
        entity_category: diagnostic
      parser_resynchronizations:
        name: ${friendly_name} Parser Resynchronizations
        entity_category: diagnostic
      frame_timeouts:
        name: ${friendly_name} Frame Timeouts
        entity_category: diagnostic
      last_packet_length:
        name: ${friendly_name} Last Packet Length
        entity_category: diagnostic
      last_packet_type:
        name: ${friendly_name} Last Packet Command
        entity_category: diagnostic
      last_packet:
        name: ${friendly_name} Last Packet
        entity_category: diagnostic
      last_unknown_packet:
        name: ${friendly_name} Last Unknown Frame
        entity_category: diagnostic
        disabled_by_default: true
      last_0x31_payload:
        name: ${friendly_name} Last 0x31 Status Payload
        entity_category: diagnostic
      last_0x33_payload:
        name: ${friendly_name} Last 0x33 General Report Payload
        entity_category: diagnostic
      last_0x40_payload:
        name: ${friendly_name} Last 0x40 Energy Payload
        entity_category: diagnostic
      last_0x44_payload:
        name: ${friendly_name} Last 0x44 Payload
        entity_category: diagnostic
        disabled_by_default: true
      last_unknown_payload:
        name: ${friendly_name} Last Unknown Payload
        entity_category: diagnostic
        disabled_by_default: true
      discovery_summary:
        name: ${friendly_name} Discovery Summary
        entity_category: diagnostic
      capture_export_csv:
        name: ${friendly_name} Capture Export CSV
        entity_category: diagnostic
      candidate_telemetry_byte_44_raw:
        name: ${friendly_name} Status Secondary Temperature Raw
        entity_category: diagnostic
      candidate_byte_44_temperature_hypothesis:
        name: ${friendly_name} Status Secondary Temperature Candidate
        entity_category: diagnostic

# The probe temporarily owns UART TX, sends the recovered neutral report
# requests, then restores normal climate polling/control.
gree_oem_boot_probe:
  id: gree_boot_probe
  uart_id: gree_uart
  climate_id: gree_ac
  start_delay: 100ms
  frame_spacing: 450ms
  quiesce_delay: 1800ms
  query_recovered_data: true
  # Discovery cadence only. Increase to 15min or disable after mapping power.
  repeat_interval: 2min
  restore_control: true

gree_oem_report_sensors:
  id: gree_oem_reports
  climate_id: gree_ac
  update_interval: 1s

  last_0x32_payload:
    name: ${friendly_name} Last 0x32 Synchronization Payload
    entity_category: diagnostic
    disabled_by_default: true
  last_0x33_payload:
    name: ${friendly_name} Last 0x33 General Report Payload Copy
    entity_category: diagnostic
    disabled_by_default: true
  last_0x34_payload:
    name: ${friendly_name} Last 0x34 Indoor Report Payload
    entity_category: diagnostic
  last_0x35_payload:
    name: ${friendly_name} Last 0x35 Outdoor Report Payload
    entity_category: diagnostic
  last_0x40_payload:
    name: ${friendly_name} Last 0x40 Energy Payload Copy
    entity_category: diagnostic

  # Mechanical discovery output only. It prints the 0x40 payload, adjacent
  # unsigned 16-bit LE/BE candidates, and 0x35 bytes 10/13/14/15. It does not
  # claim volts, amps, watts, energy, frequency, or RPM.
  power_discovery_summary:
    name: ${friendly_name} Power Discovery Summary
    entity_category: diagnostic

  indoor_report_target_temperature:
    name: ${friendly_name} Indoor Report Target Temperature
    entity_category: diagnostic
  indoor_report_current_temperature:
    name: ${friendly_name} Indoor Report Current Temperature
    entity_category: diagnostic
  indoor_coil_temperature_candidate:
    name: ${friendly_name} Indoor Coil Temperature Candidate
    entity_category: diagnostic
  indoor_secondary_temperature_candidate:
    name: ${friendly_name} Indoor Secondary Temperature Candidate
    entity_category: diagnostic

  outdoor_operating_value_raw:
    name: ${friendly_name} Outdoor Operating Value Raw
    entity_category: diagnostic
  outdoor_ambient_temperature_candidate:
    name: ${friendly_name} Outdoor Ambient Temperature Candidate
    entity_category: diagnostic
  outdoor_coil_temperature_candidate:
    name: ${friendly_name} Outdoor Coil Temperature Candidate
    entity_category: diagnostic
  compressor_discharge_temperature_candidate:
    name: ${friendly_name} Compressor Discharge Temperature Candidate
    entity_category: diagnostic

  # Byte 6 changed from 0x20 in an earlier capture to 0x00 during active
  # cooling. Keep both views raw until its meaning is proven.
  indoor_report_byte_6_raw:
    name: ${friendly_name} Indoor Report Byte 6 Raw
    entity_category: diagnostic
  indoor_report_byte_6_bit_5:
    name: ${friendly_name} Indoor Report Byte 6 Bit 5
    entity_category: diagnostic

  # Fault-parser fields recovered from the OEM firmware. Active polarity and
  # code semantics are still unknown, so these remain disabled raw diagnostics.
  indoor_report_byte_14_bit_5:
    name: ${friendly_name} Indoor Report Byte 14 Bit 5
    entity_category: diagnostic
    disabled_by_default: true
  indoor_report_byte_20_raw:
    name: ${friendly_name} Indoor Report Byte 20 Raw
    entity_category: diagnostic
    disabled_by_default: true
  indoor_report_byte_21_raw:
    name: ${friendly_name} Indoor Report Byte 21 Raw
    entity_category: diagnostic
    disabled_by_default: true
  indoor_report_byte_36_raw:
    name: ${friendly_name} Indoor Report Byte 36 Raw
    entity_category: diagnostic
    disabled_by_default: true
  indoor_report_byte_37_raw:
    name: ${friendly_name} Indoor Report Byte 37 Raw
    entity_category: diagnostic
    disabled_by_default: true
  indoor_report_byte_38_raw:
    name: ${friendly_name} Indoor Report Byte 38 Raw
    entity_category: diagnostic
    disabled_by_default: true
  outdoor_report_byte_17_bit_2:
    name: ${friendly_name} Outdoor Report Byte 17 Bit 2
    entity_category: diagnostic
    disabled_by_default: true
  outdoor_report_bytes_21_28_raw:
    name: ${friendly_name} Outdoor Report Bytes 21-28 Raw
    entity_category: diagnostic
    disabled_by_default: true
  outdoor_report_byte_30_raw:
    name: ${friendly_name} Outdoor Report Byte 30 Raw
    entity_category: diagnostic
    disabled_by_default: true
  outdoor_report_byte_31_bit_6:
    name: ${friendly_name} Outdoor Report Byte 31 Bit 6
    entity_category: diagnostic
    disabled_by_default: true
  outdoor_report_byte_36_raw:
    name: ${friendly_name} Outdoor Report Byte 36 Raw
    entity_category: diagnostic
    disabled_by_default: true

binary_sensor:
  - platform: status
    name: ${friendly_name} ESP Status
    entity_category: diagnostic

sensor:
  - platform: uptime
    name: ${friendly_name} Uptime
    entity_category: diagnostic
    update_interval: 60s
  - platform: wifi_signal
    name: ${friendly_name} WiFi Signal
    entity_category: diagnostic
    update_interval: 60s

text_sensor:
  - platform: version
    name: ${friendly_name} ESPHome Version
    entity_category: diagnostic
  - platform: wifi_info
    ip_address:
      name: ${friendly_name} IP Address
      entity_category: diagnostic
    ssid:
      name: ${friendly_name} Connected SSID
      entity_category: diagnostic
    bssid:
      name: ${friendly_name} Connected BSSID
      entity_category: diagnostic
    mac_address:
      name: ${friendly_name} MAC Address
      entity_category: diagnostic

button:
  - platform: restart
    name: ${friendly_name} Restart
    entity_category: config
  - platform: safe_mode
    name: ${friendly_name} Restart in Safe Mode
    entity_category: config
