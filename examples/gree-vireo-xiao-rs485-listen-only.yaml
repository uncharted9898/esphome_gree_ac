substitutions:
  device_name: gree-vireo-wired-monitor
  friendly_name: Gree Vireo Wired Monitor

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

esp32:
  board: seeed_xiao_esp32c3
  framework:
    type: esp-idf

logger:
  # The RS485 bus uses GPIO6/GPIO7, so keep diagnostics on the XIAO C3's
  # native USB Serial/JTAG interface. This does not share pins with COM-MANUAL.
  hardware_uart: USB_SERIAL_JTAG
  baud_rate: 115200
  level: DEBUG
  logs:
    gree_wired_rs485: INFO
    uart: WARN
    uart_debug: DEBUG

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none

api:

web_server:
  port: 80
  version: 3
  local: true
  log: false
  ota: false
  include_internal: false

ota:
  - platform: esphome
    password: !secret ota_password

# Seeed XIAO RS485 expansion board:
#   D4 / GPIO6 = UART TX
#   D5 / GPIO7 = UART RX
#   D2 / GPIO4 = DE + /RE direction control
#
# Target Vireo COM-MANUAL has now been field-verified as:
#   one ~+12 V accessory-supply conductor
#   one GND/common conductor
#   two ~5 V-class RS485 data conductors -> Seeed A/B
# Keep the +12 V conductor disconnected for the first USB-powered passive
# capture. It must never be connected to the XIAO 5 V pin.
#
# ESPHome hardware RS485 flow control keeps GPIO4 low while idle/receiving.
# The gree_wired_rs485 component has no write path, so first-deployment
# firmware cannot intentionally enable the RS485 driver.
uart:
  id: gree_com_manual_uart
  tx_pin: GPIO6
  rx_pin: GPIO7
  flow_control_pin: GPIO4
  baud_rate: 1200
  data_bits: 8
  parity: NONE
  stop_bits: 1
  rx_buffer_size: 512

  debug:
    direction: RX
    dummy_receiver: false
    debug_prefix: "[COM-MANUAL] "
    after:
      timeout: 50ms
      bytes: 128
    sequence:
      - lambda: UARTDebug::log_hex(direction, bytes, ' ', debug_prefix);

external_components:
  - source:
      type: git
      url: https://github.com/uncharted9898/esphome_gree_ac
      ref: codex/add-compatibility-and-protocol-discovery-mode
    refresh: 5min
    components:
      - gree_wired_rs485

gree_wired_rs485:
  id: gree_com_manual
  uart_id: gree_com_manual_uart
  frame_timeout: 75ms
  bus_idle_timeout: 10s
  log_frames: true

  bytes_received:
    name: ${friendly_name} Bytes Received
    entity_category: diagnostic
  valid_frames:
    name: ${friendly_name} Valid Frames
    entity_category: diagnostic
  checksum_failures:
    name: ${friendly_name} XOR Failures
    entity_category: diagnostic
  frame_timeouts:
    name: ${friendly_name} Partial Frame Timeouts
    entity_category: diagnostic
  invalid_lengths:
    name: ${friendly_name} Invalid Lengths
    entity_category: diagnostic
  unexpected_type_frames:
    name: ${friendly_name} Unexpected Type Frames
    entity_category: diagnostic
  reference_layout_frames:
    name: ${friendly_name} Reference Layout Frames
    entity_category: diagnostic
  route_variant_frames:
    name: ${friendly_name} Known Route Variants
    entity_category: diagnostic
  unknown_route_frames:
    name: ${friendly_name} Unknown Route Frames
    entity_category: diagnostic
  route_00_ff_frames:
    name: ${friendly_name} 00 to FF Frames
    entity_category: diagnostic
  route_ff_00_frames:
    name: ${friendly_name} FF to 00 Frames
    entity_category: diagnostic
  route_ff_40_frames:
    name: ${friendly_name} FF to 40 Frames
    entity_category: diagnostic
  last_source:
    name: ${friendly_name} Last Source
    entity_category: diagnostic
  last_destination:
    name: ${friendly_name} Last Destination
    entity_category: diagnostic
  last_body_length:
    name: ${friendly_name} Last Body Length
    entity_category: diagnostic

  last_frame:
    name: ${friendly_name} Last Frame
    entity_category: diagnostic
  last_payload:
    name: ${friendly_name} Last Payload
    entity_category: diagnostic
  last_route:
    name: ${friendly_name} Last Route
    entity_category: diagnostic
  last_frame_class:
    name: ${friendly_name} Last Frame Class
    entity_category: diagnostic
  last_changes:
    name: ${friendly_name} Last Payload Changes
    entity_category: diagnostic
  last_invalid_frame:
    name: ${friendly_name} Last Invalid Frame
    entity_category: diagnostic
    disabled_by_default: true
  protocol:
    name: ${friendly_name} Protocol
    entity_category: diagnostic

  bus_active:
    name: ${friendly_name} COM-MANUAL Bus Active
    entity_category: diagnostic
  listen_only:
    name: ${friendly_name} Listen Only
    entity_category: diagnostic
