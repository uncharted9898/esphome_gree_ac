substitutions:
  device_name: gree-livo-oem-boot-probe
  friendly_name: Gree Livo OEM Boot Probe

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

logger:
  baud_rate: 0
  level: INFO

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:

ota:
  - platform: esphome
    password: !secret ota_password

uart:
  id: gree_uart
  tx_pin: GPIO6
  rx_pin: GPIO4
  baud_rate: 4800
  data_bits: 8
  parity: EVEN
  stop_bits: 1

external_components:
  - source:
      type: git
      url: https://github.com/uncharted9898/esphome_gree_ac
      ref: codex/add-oem-report-sensors
    refresh: 5min
    components:
      - sinclair_ac
      - gree_oem_boot_probe
      - gree_oem_report_sensors

climate:
  - platform: sinclair_ac
    id: gree_ac
    name: ${friendly_name}
    uart_id: gree_uart

    # The probe owns TX during the captured startup and recovered telemetry
    # query window. Normal polling/control starts after the responses arrive.
    protocol_mode: receive_only
    fan_profile: gree_4_speed

    telemetry_discovery:
      enabled: true
      expose_raw_payload: true
      expose_raw_bytes: false
      log_changes_only: true
      history_depth: 64

    debug:
      log_rx: false
      log_tx: false
      log_unknown_packets: true
      log_packet_differences: true
      maximum_hex_length: 256

    diagnostics:
      communication:
        name: ${friendly_name} Communication
      valid_rx_packets:
        name: ${friendly_name} Valid RX Packets
      valid_tx_packets:
        name: ${friendly_name} Valid TX Packets
      unknown_packets:
        name: ${friendly_name} Unknown Packets
      checksum_failures:
        name: ${friendly_name} Checksum Failures
      parser_resynchronizations:
        name: ${friendly_name} Parser Resynchronizations
      frame_timeouts:
        name: ${friendly_name} Frame Timeouts
      last_packet_type:
        name: ${friendly_name} Last Packet Type
      last_packet:
        name: ${friendly_name} Last Packet
      last_unknown_packet:
        name: ${friendly_name} Last Unknown Packet
      last_0x31_payload:
        name: ${friendly_name} Last 0x31 Payload
      last_0x33_payload:
        name: ${friendly_name} Last 0x33 Payload
      last_0x40_payload:
        name: ${friendly_name} Last 0x40 Payload
      last_0x44_payload:
        name: ${friendly_name} Last 0x44 Payload
      last_unknown_payload:
        name: ${friendly_name} Last Unknown Payload
      discovery_summary:
        name: ${friendly_name} Discovery Summary
      capture_export_csv:
        name: ${friendly_name} Capture Export CSV
      candidate_telemetry_byte_44_raw:
        name: ${friendly_name} Candidate Byte 44 Raw
      candidate_byte_44_temperature_hypothesis:
        name: ${friendly_name} Candidate Byte 44 Temperature Hypothesis

gree_oem_boot_probe:
  id: gree_boot_probe
  uart_id: gree_uart
  climate_id: gree_ac
  start_delay: 100ms
  frame_spacing: 450ms
  quiesce_delay: 1800ms
  query_recovered_data: true
  # repeat_interval: 15min
  restore_control: true

gree_oem_report_sensors:
  id: gree_oem_reports
  climate_id: gree_ac
  update_interval: 1s

  last_0x32_payload:
    name: ${friendly_name} Last 0x32 Synchronization Payload
    entity_category: diagnostic
  last_0x34_payload:
    name: ${friendly_name} Last 0x34 Indoor Report Payload
    entity_category: diagnostic
  last_0x35_payload:
    name: ${friendly_name} Last 0x35 Outdoor Report Payload
    entity_category: diagnostic

  # Confirmed against the simultaneously reported 25 C target and 24 C room
  # temperature in the live Livo Gen3 capture. Formula: raw - 40.
  indoor_report_target_temperature:
    name: ${friendly_name} Indoor Report Target Temperature
    entity_category: diagnostic
  indoor_report_current_temperature:
    name: ${friendly_name} Indoor Report Current Temperature
    entity_category: diagnostic

  # Physically plausible but not yet assigned to a specific thermistor.
  indoor_report_byte_10_temperature_hypothesis:
    name: ${friendly_name} Indoor Report Byte 10 Temperature Hypothesis
    entity_category: diagnostic
    disabled_by_default: true
  indoor_report_byte_25_temperature_hypothesis:
    name: ${friendly_name} Indoor Report Byte 25 Temperature Hypothesis
    entity_category: diagnostic
    disabled_by_default: true

  outdoor_report_byte_10_raw:
    name: ${friendly_name} Outdoor Report Byte 10 Raw
    entity_category: diagnostic
    disabled_by_default: true
  outdoor_report_byte_13_temperature_hypothesis:
    name: ${friendly_name} Outdoor Report Byte 13 Temperature Hypothesis
    entity_category: diagnostic
    disabled_by_default: true
  outdoor_report_byte_14_temperature_hypothesis:
    name: ${friendly_name} Outdoor Report Byte 14 Temperature Hypothesis
    entity_category: diagnostic
    disabled_by_default: true
  outdoor_report_byte_15_temperature_hypothesis:
    name: ${friendly_name} Outdoor Report Byte 15 Temperature Hypothesis
    entity_category: diagnostic
    disabled_by_default: true
