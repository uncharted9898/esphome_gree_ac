substitutions:
  device_name: gree-livo-oem-boot-probe
  friendly_name: Gree Livo OEM Boot Probe

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

logger:
  baud_rate: 0
  level: INFO

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:

ota:
  - platform: esphome
    password: !secret ota_password

uart:
  id: gree_uart
  tx_pin: GPIO6
  rx_pin: GPIO4
  baud_rate: 4800
  data_bits: 8
  parity: EVEN
  stop_bits: 1

external_components:
  - source:
      type: git
      url: https://github.com/uncharted9898/esphome_gree_ac
      ref: research/oem-boot-sequence-probe
    refresh: 5min
    components: [sinclair_ac, gree_oem_boot_probe]

climate:
  - platform: sinclair_ac
    id: gree_ac
    name: ${friendly_name}
    uart_id: gree_uart

    # The boot-probe component owns TX for about 3.6 seconds, then changes this
    # runtime mode to control. Starting receive-only prevents normal polls from
    # colliding with the captured OEM startup sequence.
    protocol_mode: receive_only
    fan_profile: gree_4_speed

    telemetry_discovery:
      enabled: true
      expose_raw_payload: true
      expose_raw_bytes: false
      log_changes_only: true
      history_depth: 64

    debug:
      log_rx: false
      log_tx: false
      log_unknown_packets: true
      log_packet_differences: true
      maximum_hex_length: 256

    diagnostics:
      communication:
        name: ${friendly_name} Communication
      valid_rx_packets:
        name: ${friendly_name} Valid RX Packets
      valid_tx_packets:
        name: ${friendly_name} Valid TX Packets
      unknown_packets:
        name: ${friendly_name} Unknown Packets
      checksum_failures:
        name: ${friendly_name} Checksum Failures
      parser_resynchronizations:
        name: ${friendly_name} Parser Resynchronizations
      frame_timeouts:
        name: ${friendly_name} Frame Timeouts
      last_packet_type:
        name: ${friendly_name} Last Packet Type
      last_packet:
        name: ${friendly_name} Last Packet
      last_unknown_packet:
        name: ${friendly_name} Last Unknown Packet
      last_0x31_payload:
        name: ${friendly_name} Last 0x31 Payload
      last_0x33_payload:
        name: ${friendly_name} Last 0x33 Payload
      last_0x40_payload:
        name: ${friendly_name} Last 0x40 Payload
      last_0x44_payload:
        name: ${friendly_name} Last 0x44 Payload
      last_unknown_payload:
        name: ${friendly_name} Last Unknown Payload
      discovery_summary:
        name: ${friendly_name} Discovery Summary
      candidate_telemetry_byte_44_raw:
        name: ${friendly_name} Candidate Byte 44 Raw
      candidate_byte_44_temperature_hypothesis:
        name: ${friendly_name} Candidate Byte 44 Temperature Hypothesis

gree_oem_boot_probe:
  id: gree_boot_probe
  uart_id: gree_uart
  climate_id: gree_ac
  start_delay: 100ms
  frame_spacing: 450ms
  restore_control: true
