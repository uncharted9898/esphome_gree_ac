    entity_category: diagnostic

  outdoor_report_byte_4_raw:
    name: ${friendly_name} Outdoor Report Byte 4 Raw
    entity_category: diagnostic
    disabled_by_default: true
  outdoor_report_byte_4_bit_4:
    name: ${friendly_name} Outdoor Report Byte 4 Bit 4
    entity_category: diagnostic
    disabled_by_default: true
  outdoor_report_byte_5_raw:
    name: ${friendly_name} Outdoor Report Byte 5 Raw
    entity_category: diagnostic
    disabled_by_default: true
  outdoor_report_byte_6_raw:
    name: ${friendly_name} Outdoor Report Byte 6 Raw
    entity_category: diagnostic
    disabled_by_default: true
  outdoor_report_byte_9_raw:
    name: ${friendly_name} Outdoor Report Byte 9 Raw
    entity_category: diagnostic
    disabled_by_default: true
  outdoor_report_byte_10_raw:
    name: ${friendly_name} Outdoor Report Byte 10 Raw
    entity_category: diagnostic
    disabled_by_default: true
  energy_flow_raw:
    name: ${friendly_name} OEM EnergyFlow Raw (Meaning Unknown)
    entity_category: diagnostic
    disabled_by_default: true
