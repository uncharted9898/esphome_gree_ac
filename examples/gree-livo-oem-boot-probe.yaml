substitutions:
  device_name: gree-livo-oem-boot-probe
  friendly_name: Gree Livo OEM Probe

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

logger:
  baud_rate: 0
  level: DEBUG
  logs:
    api: INFO
    sensor: INFO
    text_sensor: INFO
    sinclair_ac: DEBUG
    sinclair_ac.serial: DEBUG
    gree.oem_boot_probe: DEBUG
    gree.oem_report_sensors: DEBUG

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none

api:

ota:
  - platform: esphome
    password: !secret ota_password

uart:
  id: gree_uart
  tx_pin: GPIO6
  rx_pin: GPIO4
  baud_rate: 4800
  data_bits: 8
  parity: EVEN
  stop_bits: 1
  rx_buffer_size: 2048

external_components:
  - source:
      type: git
      url: https://github.com/uncharted9898/esphome_gree_ac
      ref: agent/audit-rtl-energy-flow-command
    refresh: 5min
    components:
      - sinclair_ac
      - gree_oem_boot_probe
      - gree_oem_report_sensors

climate:
  - platform: sinclair_ac
    id: gree_ac
    name: ${friendly_name}
    uart_id: gree_uart
    protocol_mode: receive_only
    fan_profile: gree_4_speed

    telemetry_discovery:
      enabled: true
      expose_raw_payload: true
      expose_raw_bytes: false
      log_changes_only: true
      history_depth: 16

    debug:
      log_rx: false
      log_tx: false
      log_unknown_packets: true
      log_packet_differences: true
      maximum_hex_length: 256

    diagnostics:
      communication:
        name: ${friendly_name} Communication
        entity_category: diagnostic
      valid_rx_packets:
        name: ${friendly_name} Valid RX Packets
        entity_category: diagnostic
      valid_tx_packets:
        name: ${friendly_name} Valid TX Packets
        entity_category: diagnostic
      unknown_packets:
        name: ${friendly_name} Unsupported Valid Packets
        entity_category: diagnostic
      checksum_failures:
        name: ${friendly_name} Checksum Failures
        entity_category: diagnostic
      invalid_length_packets:
        name: ${friendly_name} Invalid Length Packets
        entity_category: diagnostic
      parser_resynchronizations:
        name: ${friendly_name} Parser Resynchronizations
        entity_category: diagnostic
      frame_timeouts:
        name: ${friendly_name} Frame Timeouts
        entity_category: diagnostic
      last_packet_type:
        name: ${friendly_name} Last Packet Type
        entity_category: diagnostic
      last_packet:
        name: ${friendly_name} Last Packet
        entity_category: diagnostic
      last_unknown_packet:
        name: ${friendly_name} Last Unsupported Packet
        entity_category: diagnostic
        disabled_by_default: true
      last_0x31_payload:
        name: ${friendly_name} Last 0x31 Status Payload
        entity_category: diagnostic
      last_0x33_payload:
        name: ${friendly_name} Last 0x33 Combined Payload
        entity_category: diagnostic
      last_0x40_payload:
        name: ${friendly_name} Last 0x40 Electrical Payload
        entity_category: diagnostic
      last_0x44_payload:
        name: ${friendly_name} Last 0x44 Information Payload
        entity_category: diagnostic
        disabled_by_default: true
      last_unknown_payload:
        name: ${friendly_name} Last Unsupported Payload
        entity_category: diagnostic
        disabled_by_default: true
      discovery_summary:
        name: ${friendly_name} Discovery Summary
        entity_category: diagnostic
      capture_export_csv:
        name: ${friendly_name} Capture Export CSV
        entity_category: diagnostic
        disabled_by_default: true

# The captured startup exchange is followed by the exact 29-byte RTL8720CF
# command-0x03 report requests. The probe asks for 0x33, 0x34, 0x35, an
# extended 0x31, and the opaque 0x42/0x41 pages. This normal probe requests 0x40
# only when 0x32 payload[0] advertises that report page, with one discovery
# attempt when no synchronization report has arrived yet. The full-power
# research example explicitly enables one corrected-frame unadvertised retry.
gree_oem_boot_probe:
  id: gree_boot_probe
  uart_id: gree_uart
  climate_id: gree_ac
  start_delay: 100ms
  frame_spacing: 450ms
  quiesce_delay: 1800ms
  query_recovered_data: true
  force_electrical_page_discovery: false
  # Query command 0x09 only when 0x32 advertises EnergyFlow. The full-power
  # discovery example enables the separate one-shot forced probe.
  query_energy_flow: true
  force_energy_flow_discovery: false
  energy_flow_query_result:
    name: ${friendly_name} OEM EnergyFlow Query Result
    entity_category: diagnostic
  # The complete discovery sweep runs once; scheduled cycles refresh only the 0x35
  # outdoor operating page after climate traffic becomes idle. Advertised or
  # previously confirmed EnergyFlow support is refreshed in the same cycle.
  repeat_interval: 30s
  restore_control: true

gree_oem_report_sensors:
  id: gree_oem_reports
  climate_id: gree_ac
  update_interval: 1s

  last_0x32_payload:
    name: ${friendly_name} Last 0x32 Synchronization Payload
    entity_category: diagnostic
  last_0x34_payload:
    name: ${friendly_name} Last 0x34 Indoor Report Payload
    entity_category: diagnostic
  last_0x35_payload:
    name: ${friendly_name} Last 0x35 Outdoor Report Payload
    entity_category: diagnostic
  last_0x36_payload:
    name: ${friendly_name} Last 0x36 CO2 Payload
    entity_category: diagnostic
    disabled_by_default: true
  last_0x3c_payload:
    name: ${friendly_name} Last 0x3C Smart Sleep Payload
    entity_category: diagnostic
    disabled_by_default: true

  last_0x40_payload:
    name: ${friendly_name} Last 0x40 Electrical Payload Copy
    entity_category: diagnostic
    disabled_by_default: true
  last_0x41_payload:
    name: ${friendly_name} Last 0x41 Service Page
    entity_category: diagnostic
    disabled_by_default: true
  last_0x42_payload:
    name: ${friendly_name} Last 0x42 Service Page
    entity_category: diagnostic
    disabled_by_default: true
  last_0x53_payload:
    name: ${friendly_name} Last 0x53 OEM EnergyFlow Payload
    entity_category: diagnostic
    disabled_by_default: true

  electrical_energy_capability:
    name: ${friendly_name} Electrical Energy Capability
    entity_category: diagnostic
  energy_flow_capability:
    name: ${friendly_name} OEM EnergyFlow Capability
    entity_category: diagnostic
  power_discovery_summary:
    name: ${friendly_name} Operating Telemetry Summary
    entity_category: diagnostic

  status_indoor_temperature:
    name: ${friendly_name} Status Indoor Temperature
    entity_category: diagnostic
  status_outdoor_ambient_temperature:
    name: ${friendly_name} Status Outdoor Ambient Temperature
    entity_category: diagnostic
  status_humidity_sensor_field_raw:
    name: ${friendly_name} HumSen Field Raw
    entity_category: diagnostic
    disabled_by_default: true
  status_indoor_fan_port_raw:
    name: ${friendly_name} Indoor Fan Port Raw
    entity_category: diagnostic
    disabled_by_default: true
  status_elc_all_kwh_clear:
    name: ${friendly_name} ElcAllKwhClr Flag
    entity_category: diagnostic
    disabled_by_default: true
  status_elc_erg:
    name: ${friendly_name} Electrical Energy Flag
    entity_category: diagnostic
  status_elc_gear_raw:
    name: ${friendly_name} Electrical Gear Raw
    entity_category: diagnostic
  status_elc_1kwh_raw:
    name: ${friendly_name} Elc1Kwh Raw
    entity_category: diagnostic

  indoor_report_target_temperature:
    name: ${friendly_name} Indoor Report Target Temperature
    entity_category: diagnostic
  indoor_report_current_temperature:
    name: ${friendly_name} Indoor Report Current Temperature
    entity_category: diagnostic
  indoor_coil_temperature_candidate:
    name: ${friendly_name} Indoor Evaporator Temperature
    entity_category: diagnostic
  indoor_report_byte_25_raw:
    name: ${friendly_name} Indoor Report Byte 25 Raw
    entity_category: diagnostic
    disabled_by_default: true

  # Firmware v1.21 maps 0x35 payload[5] directly to CompressorFqy.
  compressor_frequency:
    name: ${friendly_name} Compressor Frequency
    entity_category: diagnostic
  outdoor_fan_speed_raw:
    name: ${friendly_name} Outdoor Fan Candidate Raw
    entity_category: diagnostic
  expansion_valve_position:
    name: ${friendly_name} Expansion Valve Position Candidate Raw
    entity_category: diagnostic
  expansion_valve_closing:
    name: ${friendly_name} Expansion Valve Closing Candidate
    entity_category: diagnostic
  outdoor_operating_state_raw:
    name: ${friendly_name} Outdoor Operating State Raw
    entity_category: diagnostic
    disabled_by_default: true
  outdoor_ambient_temperature_candidate:
    name: ${friendly_name} Outdoor Ambient Temperature
    entity_category: diagnostic
  outdoor_coil_temperature_candidate:
    name: ${friendly_name} Outdoor Coil Temperature
    entity_category: diagnostic
  compressor_discharge_temperature_candidate:
