substitutions:
  device_name: gree-vireo-wired-monitor
  friendly_name: Gree Vireo Wired Monitor
  wifi_ssid: ""
  wifi_password: ""
  ota_password: ""
  # Field-test opt-in. Normal deployments remain passive unless the device YAML
  # overrides this substitution to "true".
  gree_oem_rtl_probe: "false"
  gree_oem_rtl_probe_delay: "5s"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

esp32:
  board: seeed_xiao_esp32c3
  framework:
    type: esp-idf

logger:
  hardware_uart: USB_SERIAL_JTAG
  baud_rate: 115200
  level: DEBUG
  logs:
    gree_wired_rs485: INFO
    uart: WARN
    uart_debug: DEBUG

wifi:
  ssid: "${wifi_ssid}"
  password: "${wifi_password}"
  power_save_mode: none

api:

web_server:
  port: 80
  version: 3
  local: true
  log: false
  ota: false
  include_internal: false

ota:
  - platform: esphome
    password: "${ota_password}"

# Seeed XIAO ESP32-C3 + RS485 expansion board
#
# D4 / GPIO6 = UART TX
# D5 / GPIO7 = UART RX
# D2 / GPIO4 = DE + /RE direction control
#
# Field-qualified target Vireo COM-MANUAL:
#   pin 1 -> Seeed dedicated +12 V input
#   pin 2 -> Seeed GND
#   pin 3 -> Seeed A
#   pin 4 -> Seeed B
#   120R termination -> OFF
#   5V selector -> IN
#
# Note: 120R OFF does not make the Seeed V1.1 front-end electrically neutral.
# Its populated RS485 network still biases B toward 3.3V through R10=10k and A
# toward GND through R11=10k, with 10-ohm series R13/R14. This matters because
# the Vireo gas-sensor and wired-controller functions share COM-MANUAL.
#
# R32 qualification note:
# The indoor display flashes FE three to four times during a cold start whenever
# the Seeed A/B pair is connected, regardless of which way A/B is oriented.
# With A/B disconnected the startup FE flash is absent. Do not use FE as an A/B
# polarity test.
#
# Deterministic manual RS485 direction:
# GPIO4 drives the Seeed board's tied DE + /RE input directly. LOW is receive,
# HIGH is transmit. The component owns GPIO4 explicitly so the receiver remains
# enabled whenever no frame is actually being written.
#
uart:
  id: gree_com_manual_uart
  tx_pin: GPIO6
  rx_pin: GPIO7
  baud_rate: 1200
  data_bits: 8
  parity: NONE
  stop_bits: 1
  rx_buffer_size: 512

  # Raw RX capture sits underneath the frame parser. This is deliberately left
  # enabled during protocol qualification so electrically received bytes remain
  # visible even when they do not match the recovered legacy framing.
  debug:
    direction: RX
    dummy_receiver: false
    debug_prefix: "[COM-MANUAL] "
    after:
      timeout: 50ms
      bytes: 128
    sequence:
      - lambda: UARTDebug::log_hex(direction, bytes, ' ', debug_prefix);

external_components:
  - source:
      type: git
      url: https://github.com/uncharted9898/esphome_gree_ac
      ref: codex/add-compatibility-and-protocol-discovery-mode
    refresh: 0s
    components:
      - gree_wired_rs485

gree_wired_rs485:
  id: gree_com_manual
  uart_id: gree_com_manual_uart
  frame_timeout: 75ms
  bus_idle_timeout: 10s
  log_frames: true
  passive_scan: false
  # October 2 Vireo qualification proved the borrowed GKH/XK76 bootstrap gets
  # no post-release UART byte or GPIO edge from this target. Keep the normal
  # deployment package genuinely receive-only until an XE71-specific session
  # transaction is recovered.
  active_probe: false
  legacy_gkh_xk76_probe: false
  # Separate controller-first experiment recovered from two current GREE
  # RTL8720CF appliance-UART firmware generations. Kept off in the passive base.
  oem_rtl_probe: ${gree_oem_rtl_probe}
  oem_rtl_probe_delay: ${gree_oem_rtl_probe_delay}
  active_probe_interval: 1200ms
  registration_attempts: 4
  silent_bootstrap_probe: false
  silent_bootstrap_delay: 5s
  hardware_half_duplex: false
  # The Seeed TP8485E board ties DE and /RE together. With DE high the receiver
  # output is high-impedance and the board's optional RX pull-up is not fitted,
  # so keep the ESP32 UART input weakly idle-high during our TX interval.
  rx_idle_pullup: true
  # Runtime controller replies belong to the legacy GKH/XK76 codec and stay
  # disabled in normal XE71/Vireo discovery. A future XE71 runtime path must be
  # backed by XE71-specific capture evidence rather than legacy status expansion.
  persistent_controller: false
  rx_line_gpio: 7
  direction_gpio: 4

  bytes_received:
    name: ${friendly_name} Bytes Received
    entity_category: diagnostic
  valid_frames:
    name: ${friendly_name} Valid Frames
    entity_category: diagnostic
  checksum_failures:
