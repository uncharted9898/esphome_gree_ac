substitutions:
  device_name: gree-vireo-wired-monitor
  friendly_name: Gree Vireo Wired Monitor
  wifi_ssid: ""
  wifi_password: ""
  ota_password: ""

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

esp32:
  board: seeed_xiao_esp32c3
  framework:
    type: esp-idf

logger:
  hardware_uart: USB_SERIAL_JTAG
  baud_rate: 115200
  level: DEBUG
  logs:
    gree_wired_rs485: INFO
    uart: WARN
    uart_debug: DEBUG

wifi:
  ssid: "${wifi_ssid}"
  password: "${wifi_password}"
  power_save_mode: none

api:

web_server:
  port: 80
  version: 3
  local: true
  log: false
  ota: false
  include_internal: false

ota:
  - platform: esphome
    password: "${ota_password}"

# Seeed XIAO ESP32-C3 + RS485 expansion board
#
# D4 / GPIO6 = UART TX
# D5 / GPIO7 = UART RX
# D2 / GPIO4 = DE + /RE direction control
#
# Field-qualified target Vireo COM-MANUAL:
#   pin 1 -> Seeed dedicated +12 V input
#   pin 2 -> Seeed GND
#   pin 3 -> Seeed A
#   pin 4 -> Seeed B
#   120R termination -> OFF
#   5V selector -> IN
#
# R32 qualification note:
# The indoor display flashes FE three to four times during a cold start whenever
# the Seeed A/B pair is connected, regardless of which way A/B is oriented.
# With A/B disconnected the startup FE flash is absent. Do not use FE as an A/B
# polarity test.
#
# ESP-IDF hardware half-duplex RS485:
# GPIO4 is routed as UART RTS/DE. ESP-IDF UART_MODE_RS485_HALF_DUPLEX asserts
# DE only while bytes are physically leaving the UART and returns it to receive
# automatically at the end of the frame. This removes software scheduling from
# the critical TX->RX turnaround.
#
uart:
  id: gree_com_manual_uart
  tx_pin: GPIO6
  rx_pin: GPIO7
  flow_control_pin: GPIO4
  baud_rate: 1200
  data_bits: 8
  parity: NONE
  stop_bits: 1
  rx_buffer_size: 512

  # Raw RX capture sits underneath the frame parser. This is deliberately left
  # enabled during protocol qualification so electrically received bytes remain
  # visible even when they do not match the recovered legacy framing.
  debug:
    direction: RX
    dummy_receiver: false
    debug_prefix: "[COM-MANUAL] "
    after:
      timeout: 50ms
      bytes: 128
    sequence:
      - lambda: UARTDebug::log_hex(direction, bytes, ' ', debug_prefix);

external_components:
  - source:
      type: git
      url: https://github.com/uncharted9898/esphome_gree_ac
      ref: codex/add-compatibility-and-protocol-discovery-mode
    refresh: 0s
    components:
      - gree_wired_rs485

gree_wired_rs485:
  id: gree_com_manual
  uart_id: gree_com_manual_uart
  frame_timeout: 75ms
  bus_idle_timeout: 10s
  log_frames: true
  passive_scan: false
  active_probe: true
  active_probe_interval: 1200ms
  registration_attempts: 4
  hardware_half_duplex: true
  # Runtime controller replies stay disabled until the target Vireo proves
  # registration by expanding FF->40 beyond the pre-registration layout.
  persistent_controller: false
  rx_line_gpio: 7
  direction_gpio: 4

  bytes_received:
    name: ${friendly_name} Bytes Received
    entity_category: diagnostic
  valid_frames:
    name: ${friendly_name} Valid Frames
    entity_category: diagnostic
  checksum_failures:
    name: ${friendly_name} XOR Failures
    entity_category: diagnostic
  frame_timeouts:
    name: ${friendly_name} Partial Frame Timeouts
    entity_category: diagnostic
  invalid_lengths:
    name: ${friendly_name} Invalid Lengths
    entity_category: diagnostic
  unexpected_type_frames:
    name: ${friendly_name} Unexpected Type Frames
    entity_category: diagnostic
  reference_layout_frames:
    name: ${friendly_name} Reference Layout Frames
    entity_category: diagnostic
  route_variant_frames:
    name: ${friendly_name} Known Route Variants
    entity_category: diagnostic
  unknown_route_frames:
    name: ${friendly_name} Unknown Route Frames
    entity_category: diagnostic
  route_00_ff_frames:
    name: ${friendly_name} 00 to FF Frames
    entity_category: diagnostic
  route_ff_00_frames:
    name: ${friendly_name} FF to 00 Frames
    entity_category: diagnostic
  route_ff_40_frames:
    name: ${friendly_name} FF to 40 Frames
    entity_category: diagnostic
  last_source:
    name: ${friendly_name} Last Source
    entity_category: diagnostic
  last_destination:
    name: ${friendly_name} Last Destination
    entity_category: diagnostic
  last_body_length:
    name: ${friendly_name} Last Body Length
    entity_category: diagnostic
  rx_transitions:
    name: ${friendly_name} RX Level Transitions
    entity_category: diagnostic
  rx_high_percent:
    name: ${friendly_name} RX High Percent
    entity_category: diagnostic
  controller_polls_seen:
    name: ${friendly_name} Controller Polls Seen
    entity_category: diagnostic
  controller_responses_sent:
    name: ${friendly_name} Controller Responses Sent
    entity_category: diagnostic

  last_frame:
    name: ${friendly_name} Last Frame
    entity_category: diagnostic
  last_payload:
    name: ${friendly_name} Last Payload
    entity_category: diagnostic
  last_route:
    name: ${friendly_name} Last Route
    entity_category: diagnostic
  last_frame_class:
    name: ${friendly_name} Last Frame Class
    entity_category: diagnostic
  last_changes:
    name: ${friendly_name} Last Payload Changes
    entity_category: diagnostic
  last_invalid_frame:
    name: ${friendly_name} Last Invalid Frame
    entity_category: diagnostic
